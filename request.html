<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Request a consultation with Gosele Consulting for training, occupational health and safety, stakeholder facilitation or ISO management systems support.">
    <title>Request a Consultation | Gosele Consulting</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
<section>
    <div class="wrap">
        <div class="card page-hero hero-request">
            <h1>Request a Consultation</h1>
            <p>Tell us what support your organisation needs and we’ll be in touch.</p>
            <a class="circ" href="#request-form" aria-label="Scroll to the consultation request form">↓</a>
        </div>
    </div>
</section>
<section id="request-form">
    <div class="wrap">
        <form class="grey" data-mail="Quote request">
            <h2>
                Request a consultation
            </h2>
            <label>
                Full name *
            </label>
            <input name="Name" required>
            <label>
                Email *
            </label>
            <input type="email" name="Email" required>
            <label>
                Company
            </label>
            <input name="Company">
            <label>
                Service area
            </label>
            <select name="Service area">
                <option>
                    Skills development and accredited training
                </option>
                <option>
                    Occupational health and safety compliance
                </option>
                <option>
                    Social and stakeholder facilitation
                </option>
                <option>
                    ISO management systems
                </option>
                <option>
                    Other
                </option>
            </select>
            <label>
                How can we help? *
            </label>
            <textarea name="Details" required></textarea>
            <button class="go" type="submit">Send request</button>
            <p class="status"></p>
        </form>
    </div>
</section>
<script src="JS/script.js"></script>
</body>
</html>
