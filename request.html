<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Gosele Consulting and Projects: construction, project management and consulting.">
        <title>Request | Gosele Consulting and Projects</title>
        <link rel="stylesheet" href="CSS/style.css">
    </head>
    <body>
        <section>
            <div class="wrap">
                <div class="card">
                    <h1>Request a Quote</h1>
                    <p>Tell us about your project and we’ll map a practical, cost-conscious path to delivery.</p>
                    <div class="circ">↓</div>
                </div>
            </div>
        </section>
        <section>
            <div class="wrap">
                <form class="grey" data-mail="Quote request">
                    <h2>
                        Request a quote
                    </h2>

                    <label>
                        Full name *
                    </label>

                    <input name="Name" required>
                    <label>
                        Email *
                    </label>
                    <input type="email" name="Email" required>
                    <label>
                        Company
                    </label>
                    <input name="Company">
                    <label>
                        Project type
                        </label>
                    <select name="Project type">

                        <option>
                            Construction
                        </option>
                        <option>
                            Renovation
                        </option>
                        <option>
                            Consulting
                        </option>
                        <option>
                            Project management
                        </option>
                    </select>
                    <label>
                        Project details *</label>
                    <textarea name="Details" required></textarea>
                    
                    <button class="go" type="submit">Submit</button>
                    <p class="status"></p>
                </form>
            </div>
        </section>
        <script src="JS/script.js"></script>
    </body>
</html>
