<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Gosele Consulting and Projects: construction, project management and consulting.">
        <title>Contact | Gosele Consulting and Projects</title>
        <link rel="stylesheet" href="CSS/style.css">
    </head>
    <body>
        <section>
            <div class="wrap">
                <div class="card">
                    <h1>Contact Us</h1>
                    <p>Contact us for enquiries, collaboration or any questions. Reach us via the form, email or phone.</p>
                    <div class="circ">↓</div>
                </div>
            </div>
        </section>
        <section>
            <div class="wrap">
                <form class="grey" data-mail="Website enquiry">
                    <h2>Contact us</h2>
                    <label>First name</label>
                    <input name="First name" required>
                    <label>Last name</label>
                    <input name="Last name">
                    <label>Email *</label>
                    <input type="email" name="Email" required>
                    <label>Message *</label>
                    <textarea name="Message" required></textarea>
                    <button class="go" type="submit">Submit</button>
                    <p class="status"></p>
                </form>
            </div>
        </section>
        <script src="JS/script.js"></script>
    </body>
</html>
