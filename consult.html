<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Gosele Consulting and Projects: construction, project management and consulting.">
        <title>Book a Consultation | Gosele Consulting and Projects</title>
        <link rel="stylesheet" href="CSS/style.css">
    </head>
    <body>
        <section>
            <div class="wrap">
                <div class="card">
                    <h1>Book a Consultation</h1>
                    <p>Choose a time that suits you and we’ll confirm.</p>
                    <div class="circ">↓</div>
                </div>
            </div>
        </section>
        <section>
            <div class="wrap">
                <form class="grey" data-mail="Consultation booking">
                    <h2>
                        Consultation
                    </h2>

                    <label>
                        Full name *
                    </label>
                    <input name="Name" required>

                    <label>
                        Email *
                    </label>
                    <input type="email" name="Email" required>
                    <label>
                        Phone
                    </label>
                    <input name="Phone">
                    <label>
                        Preferred date
                    </label>
                    <input type="date" name="Date">
                    <label>
                        What would you like to discuss?
                    </label>
                    <textarea name="Topic"></textarea>
                    
                    <button class="go" type="submit">Submit</button>
                    <p class="status"></p>
                </form>
            </div>
        </section>
        <script src="JS/script.js"></script>
    </body>
</html>
