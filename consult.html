<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Book a consultation with Gosele Consulting to discuss your organisation’s training, safety, stakeholder facilitation or ISO needs.">
    <title>Book a Consultation | Gosele Consulting</title>
    <link rel="icon" type="image/png" href="assets/gosele-favicon.png">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
<section>
    <div class="wrap">
        <div class="card page-hero hero-consult">
            <h1>Book a Consultation</h1>
            <p>Tell us what you’d like to discuss and we’ll get back to you.</p>
            <a class="circ" href="#consultation-form" aria-label="Scroll to the consultation form">↓</a>
        </div>
    </div>
</section>
<section id="consultation-form">
    <div class="wrap">
        <form class="grey" data-mail="Consultation booking">
            <h2>Consultation</h2>
            <label>Full name *</label>
            <input name="Name" required>
            <label>Email *</label>
            <input type="email" name="Email" required>
            <label>Phone</label>
            <input name="Phone">
            <label>Preferred date</label>
            <input type="date" name="Date">
            <label>What would you like to discuss?</label>
            <textarea name="Topic"></textarea>
            <button class="go" type="submit">Submit</button>
            <p class="status"></p>
        </form>
    </div>
</section>
<script src="JS/script.js"></script>
</body>
</html>
